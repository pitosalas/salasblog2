<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ title }}{% endblock %} - Salas Blog</title>
    <meta name="description" content="{% block description %}Personal blog and website{% endblock %}">
    <link rel="EditURI" type="application/rsd+xml" title="RSD" href="/rsd.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/header.css">
    <link rel="stylesheet" href="/static/css/layout.css">
    <link rel="stylesheet" href="/static/css/entries.css">
    <link rel="stylesheet" href="/static/css/post-detail.css">
    {% block extra_css %}{% endblock %}
    <script src="/static/js/theme-toggle.js"></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/"><span class="accent">~/</span>pito salas</a>
        <nav class="site-nav">
            <a href="/">home</a>
            <a href="/blog/">blog</a>
            <a href="/raindrops/">link blog</a>
            <a href="/pages/">pages</a>
            <a href="/admin/new-post" class="new-post admin-new-post d-none">+ new post</a>
        </nav>
        <div class="header-actions">
            <div class="search-container">
                <input type="search" id="search-input" placeholder="search..." aria-label="Search">
                <div id="search-results" class="search-results"></div>
            </div>
            <a href="/admin" class="admin-link">admin</a>
            <button id="theme-toggle" class="theme-toggle" type="button">dark mode</button>
        </div>
    </header>

    <main class="site-main">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; {{ current_year }} Salas Blog. All rights reserved.</p>
    </footer>

    <script src="/static/js/script.js"></script>
    <script src="/static/js/admin-delete.js"></script>
    <script>
        async function checkAdminStatus() {
            try {
                const response = await fetch('/api/admin-status');
                const data = await response.json();
                if (data.authenticated) {
                    const adminControls = document.querySelector('.admin-controls');
                    const newPostBtn = document.querySelector('.admin-new-post');
                    if (adminControls) adminControls.classList.remove('d-none');
                    if (newPostBtn) newPostBtn.classList.remove('d-none');
                }
            } catch (error) {
                console.error('Failed to check admin status:', error);
            }
        }

        document.addEventListener('DOMContentLoaded', checkAdminStatus);
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
