<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview: {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-3 mb-3">
        <a class="navbar-brand" href="/">Salas Blog</a>
        <span class="navbar-text">Preview</span>
        <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm" onclick="saveAndClose()">Save &amp; Close</button>
            <button class="btn btn-secondary btn-sm" onclick="window.close()">Close</button>
        </div>
    </nav>
    <div class="container">
        <p class="text-muted small">This is how your post will appear on the blog</p>
        <h1 class="display-6">{{ title }}</h1>
        <div>{{ html_content|safe }}</div>
    </div>
    
    <script>
        // Form data passed from the edit page
        const postData = {
            title: {{ title|tojson }},
            content: {{ content|tojson }},
            date: {{ date|tojson }},
            category: {{ category|tojson }},
            type: {{ type|tojson }},
            filename: {{ filename|tojson }}
        };
        
        async function saveAndClose() {
            const saveBtn = event.target;
            const originalText = saveBtn.textContent;
            saveBtn.textContent = '💾 Saving...';
            saveBtn.disabled = true;
            
            try {
                // Create form data with the current post data
                const formData = new FormData();
                formData.append('title', postData.title);
                formData.append('content', postData.content);
                formData.append('date', postData.date);
                formData.append('category', postData.category);
                formData.append('type', postData.type);
                
                const response = await fetch(`/admin/edit-post/${postData.filename}`, {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('✓ Post saved successfully!');
                    window.close();
                } else {
                    throw new Error(result.detail || 'Save failed');
                }
            } catch (error) {
                alert('✗ Error saving: ' + error.message);
            } finally {
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
