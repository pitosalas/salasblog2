{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<div class="page-header">
    <h1>{{ page.title }}</h1>
    
    <div class="admin-controls alert alert-light border mb-3" style="display: none;">
        <h6 class="alert-heading mb-2">Admin Actions</h6>
        <div class="d-flex gap-2 flex-wrap">
            <a href="/admin/edit-page/{{ page.filename }}" class="btn btn-sm btn-primary">Edit</a>
            <button onclick="deletePage('{{ page.filename }}')" class="btn btn-sm btn-danger">Delete</button>
        </div>
    </div>
</div>

<section class="page-content">
    {{ page.content | safe }}
</section>
{% endblock %}
