{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<article>
    <header class="post-header">
        <h1 class="post-title">{{ page.title }}</h1>
        <div class="admin-controls d-none admin-actions">
            <a href="/admin/edit-page/{{ page.filename }}" class="btn btn-primary btn-sm">Edit</a>
            <button onclick="deletePage('{{ page.filename }}', this)" class="btn btn-danger btn-sm">Delete</button>
        </div>
    </header>

    <div class="post-body">
        {{ page.content | safe }}
    </div>
</article>
{% endblock %}
