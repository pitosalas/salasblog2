{% extends "base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <header class="mb-4 pb-3 border-bottom">
            <h1 class="display-6">{{ page.title }}</h1>
            <div class="admin-controls d-none mt-2">
                <a href="/admin/edit-page/{{ page.filename }}" class="btn btn-primary btn-sm">Edit</a>
                <button onclick="deletePage('{{ page.filename }}')" class="btn btn-danger btn-sm">Delete</button>
            </div>
        </header>

        <section>
            {{ page.content | safe }}
        </section>
    </div>
</div>
{% endblock %}
