<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ content_type_title|default('Post') }} - {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-3 mb-4">
        <a class="navbar-brand" href="/">Salas Blog</a>
        <span class="navbar-text">Edit {{ content_type_title|default('Post') }}: {{ title }}</span>
        <a href="/admin" class="nav-link text-white-50 small">Admin</a>
    </nav>

    <div class="container">
        <form id="editForm">
            <div id="statusMessage" class="alert d-none mb-3"></div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="title" class="form-label">{{ content_type_title|default('Post') }} Title</label>
                    <input type="text" id="title" name="title" class="form-control" value="{{ title }}" required>
                </div>
                <div class="col-md-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ date }}" required>
                </div>

                <input type="hidden" id="type" name="type" value="{{ content_type }}">
            </div>

            {% if content_type == 'blog' %}
            <div class="mb-3">
                <label class="form-label">Tags</label>
                <div class="d-flex flex-wrap gap-2">
                    {% for tag in blog_tags %}
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="checkbox" name="tags" id="tag_{{ tag }}" value="{{ tag }}"
                            {% if tag in (tags or []) %}checked{% endif %}>
                        <label class="form-check-label" for="tag_{{ tag }}">{{ tag }}</label>
                    </div>
                    {% endfor %}
                </div>
            </div>
            {% endif %}

            <div class="mb-3">
                <label for="content" class="form-label">Content (Markdown)</label>
                <textarea id="content" name="content" class="form-control" rows="20" placeholder="Write your post content in Markdown...">{{ content }}</textarea>
            </div>
        </form>

        <div class="d-flex gap-2 mb-4 flex-wrap">
            <a href="{{ cancel_url|default('/blog/') }}" class="btn btn-secondary">Cancel</a>
            <button type="button" class="btn btn-outline-primary" onclick="previewPost()">Preview</button>
            <button type="button" class="btn btn-success" onclick="savePost()">Save {{ content_type_title|default('Post') }}</button>
            <button type="button" class="btn btn-secondary" onclick="closeEditor()">Close</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function savePost() {
            const form = document.getElementById('editForm');
            const statusMessage = document.getElementById('statusMessage');
            const title = document.getElementById('title').value.trim();
            const date = document.getElementById('date').value;
            const content = document.getElementById('content').value.trim();

            if (!title) { showStatus('error', 'Please enter a post title'); return; }
            if (!date) { showStatus('error', 'Please select a date'); return; }
            if (!content) { showStatus('error', 'Please enter some content'); return; }

            const saveBtn = event.target;
            const originalText = saveBtn.textContent;
            saveBtn.textContent = 'Saving...';
            saveBtn.disabled = true;

            try {
                const response = await fetch('{{ action_url|default("/admin/edit-post/" + filename) }}', {
                    method: 'POST',
                    body: new FormData(form)
                });
                const result = await response.json();
                if (response.ok) {
                    showStatus('success', '{{ content_type_title|default("Post") }} saved successfully!');
                    setTimeout(() => statusMessage.classList.add('d-none'), 3000);
                } else {
                    throw new Error(result.detail || 'Save failed');
                }
            } catch (error) {
                showStatus('error', 'Error: ' + error.message);
            } finally {
                saveBtn.textContent = originalText;
                saveBtn.disabled = false;
            }
        }

        function showStatus(type, message) {
            const el = document.getElementById('statusMessage');
            el.className = 'alert mb-3 alert-' + (type === 'error' ? 'danger' : 'success');
            el.textContent = message;
        }

        function previewPost() {
            const content = document.getElementById('content').value;
            const title = document.getElementById('title').value;
            if (!content.trim()) { alert('Please enter some content to preview'); return; }
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/admin/preview-post';
            form.target = '_blank';
            [['title', title], ['content', content], ['date', document.getElementById('date').value],
             ['type', document.getElementById('type').value],
             ['filename', window.location.pathname.split('/').pop()]].forEach(([name, value]) => {
                const input = document.createElement('input');
                input.type = 'hidden'; input.name = name; input.value = value;
                form.appendChild(input);
            });
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }

        function closeEditor() {
            if (window.history.length > 1) { window.history.back(); }
            else { window.location.href = '/admin'; }
        }

        const dateField = document.getElementById('date');
        if (!dateField.value) dateField.value = new Date().toISOString().split('T')[0];
    </script>
</body>
</html>
