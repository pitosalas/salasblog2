<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit {{ content_type_title|default('Post') }} - {{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    {% include 'includes/navigation.html' %}
    
    <main class="main">
        <div class="page-header">
            <h1>Edit {{ content_type_title|default('Post') }}: {{ title }}</h1>
        </div>
        
        <div class="container">
        <form id="editForm" class="bg-white p-4 rounded shadow-sm">
            <div id="statusMessage" class="alert" style="display: none;"></div>
            
            <div class="row mb-3">
                <div class="col-md-6 mb-3">
                    <label for="title" class="form-label">{{ content_type_title|default('Post') }} Title</label>
                    <input type="text" id="title" name="title" class="form-control" value="{{ title }}" required>
                </div>
                
                <div class="col-md-3 mb-3">
                    <label for="date" class="form-label">Date</label>
                    <input type="date" id="date" name="date" class="form-control" value="{{ date }}" required>
                </div>
                
                <div class="col-md-3 mb-3">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" id="category" name="category" class="form-control" value="{{ category }}">
                </div>
                
                <!-- Content type is automatically determined by the editing context -->
                <input type="hidden" id="type" name="type" value="{{ content_type }}">
            </div>
            
            <div class="mb-3">
                <label for="content" class="form-label">Content (Markdown)</label>
                <textarea id="content" name="content" class="form-control" rows="15" placeholder="Write your post content in Markdown...">{{ content }}</textarea>
            </div>
        </form>
        
            <div class="d-flex justify-content-center gap-2 flex-wrap mb-4">
                <a href="{{ cancel_url|default('/blog/') }}" class="btn btn-secondary">Cancel</a>
                <button type="button" class="btn btn-primary" onclick="previewPost()">Preview</button>
                <button type="button" class="btn btn-success" onclick="savePost()">Save {{ content_type_title|default('Post') }}</button>
                <button type="button" class="btn btn-secondary" onclick="closeEditor()">Close</button>
            </div>
        </div>
    </main>
    
    <script src="/static/js/form-validation.js"></script>
    <script src="/static/js/preview.js"></script>
    <script>
        // Initialize preview functionality
        document.addEventListener('DOMContentLoaded', function() {
            initializePreview();
        });
        
        // Save post function specific to this page
        function savePost() {
            const endpoint = '{{ action_url|default("/admin/edit-post/" + filename) }}';
            savePost(endpoint);
        }
        
        // Preview function
        function previewPost() {
            previewPost(false); // false = existing post
        }
    </script>
</body>
</html>
