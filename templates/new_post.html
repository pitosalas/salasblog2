<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New {{ content_type_title|default('Post') }} - Salas Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-3 mb-4">
        <a class="navbar-brand" href="/">Salas Blog</a>
        <span class="navbar-text">Create New {{ content_type_title|default('Post') }}</span>
        <a href="/admin" class="nav-link text-white-50 small">Admin</a>
    </nav>
    <div class="container">
        <form id="newPostForm">
            <div id="statusMessage" class="alert d-none mb-3"></div>

            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label for="title" class="form-label">{{ content_type_title|default('Post') }} Title *</label>
                    <input type="text" id="title" name="title" class="form-control" required placeholder="Enter your {{ content_type|default('post') }} title">
                    <div id="filenameHint" class="form-text">This will be used to generate the filename</div>
                </div>
                <div class="col-md-3">
                    <label for="date" class="form-label">Date *</label>
                    <input type="date" id="date" name="date" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <label for="category" class="form-label">Category</label>
                    <input type="text" id="category" name="category" class="form-control" value="General" placeholder="General">
                </div>
                <input type="hidden" id="type" name="type" value="{{ content_type }}">
            </div>

            <div class="mb-3">
                <label for="content" class="form-label">Content (Markdown) *</label>
                <textarea id="content" name="content" class="form-control" rows="20" placeholder="Write your {{ content_type|default('post') }} content in Markdown..." required></textarea>
                <div class="form-text">Use Markdown syntax for formatting. You can preview before saving.</div>
            </div>
        </form>

        <div class="d-flex gap-2 mb-4 flex-wrap">
            <a href="{{ cancel_url|default('/blog/') }}" class="btn btn-secondary">Cancel</a>
            <button type="button" class="btn btn-outline-primary" onclick="previewPost()">Preview</button>
            <button type="button" class="btn btn-success" onclick="createPost()">Create {{ content_type_title|default('Post') }}</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        async function createPost() {
            const form = document.getElementById('newPostForm');
            const title = document.getElementById('title').value.trim();
            const date = document.getElementById('date').value;
            const content = document.getElementById('content').value.trim();

            if (!title) { showStatus('error', 'Please enter a title'); return; }
            if (!date) { showStatus('error', 'Please select a date'); return; }
            if (!content) { showStatus('error', 'Please enter some content'); return; }

            const createBtn = event.target;
            const originalText = createBtn.textContent;
            createBtn.textContent = 'Creating...';
            createBtn.disabled = true;

            try {
                const response = await fetch('{{ action_url|default("/admin/new-post") }}', {
                    method: 'POST',
                    body: new FormData(form)
                });
                const result = await response.json();
                if (response.ok) {
                    showStatus('success', `{{ content_type_title|default("Post") }} created! Filename: ${result.filename}`);
                    form.reset();
                    document.getElementById('date').value = '{{ current_date }}';
                    setTimeout(() => {
                        {% if content_type == 'page' %}
                        window.location.href = `/${result.filename.replace('.md', '.html')}`;
                        {% else %}
                        window.location.href = `/blog/${result.filename.replace('.md', '.html')}`;
                        {% endif %}
                    }, 2000);
                } else {
                    throw new Error(result.detail || 'Creation failed');
                }
            } catch (error) {
                showStatus('error', 'Error: ' + error.message);
            } finally {
                createBtn.textContent = originalText;
                createBtn.disabled = false;
            }
        }

        function showStatus(type, message) {
            const el = document.getElementById('statusMessage');
            el.className = 'alert mb-3 alert-' + (type === 'error' ? 'danger' : 'success');
            el.textContent = message;
        }

        function previewPost() {
            const content = document.getElementById('content').value;
            const title = document.getElementById('title').value;
            if (!content.trim()) { alert('Please enter some content to preview'); return; }
            if (!title.trim()) { alert('Please enter a title to preview'); return; }
            const form = document.createElement('form');
            form.method = 'POST';
            form.action = '/admin/preview-new-post';
            form.target = '_blank';
            [['title', title], ['content', content], ['date', document.getElementById('date').value],
             ['category', document.getElementById('category').value], ['type', document.getElementById('type').value]].forEach(([name, value]) => {
                const input = document.createElement('input');
                input.type = 'hidden'; input.name = name; input.value = value;
                form.appendChild(input);
            });
            document.body.appendChild(form);
            form.submit();
            document.body.removeChild(form);
        }

        function updateFilenameHint() {
            const title = document.getElementById('title').value.trim();
            const date = document.getElementById('date').value;
            const hint = document.getElementById('filenameHint');
            if (title && date) {
                const safeTitle = title.toLowerCase().replace(/[^\w\s-]/g, '').replace(/[-\s]+/g, '-').replace(/^-+|-+$/g, '');
                hint.textContent = `Filename will be: ${date}-${safeTitle}.md`;
            } else {
                hint.textContent = 'This will be used to generate the filename';
            }
        }

        const dateField = document.getElementById('date');
        if (!dateField.value) dateField.value = new Date().toISOString().split('T')[0];
        document.getElementById('title').addEventListener('input', updateFilenameHint);
        document.getElementById('date').addEventListener('change', updateFilenameHint);
    </script>
</body>
</html>
