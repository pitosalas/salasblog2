<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Salas Blog</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex justify-content-center align-items-center min-vh-100">
        <div class="card shadow" style="width: 100%; max-width: 400px;">
            <div class="card-body p-4">
                <h1 class="card-title h4 text-center mb-4">Admin Login</h1>
                <form method="post" action="/admin">
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" id="password" name="password" class="form-control" required autofocus>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                    {% if error %}
                    <div class="alert alert-danger mt-3 mb-0">Incorrect password. Please try again.</div>
                    {% endif %}
                </form>
                <div class="text-center mt-3">
                    <a href="/" class="text-muted small">&larr; Back to Blog</a>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
