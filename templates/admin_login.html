<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Salas Blog</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/admin-login.css">
</head>
<body>
    <div class="login-card">
        <h1 class="login-title">Admin Login</h1>
        <form method="post" action="/admin">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" required autofocus>
            <button type="submit" class="login-submit">Login</button>
            {% if error %}
            <div class="login-error">Incorrect password. Please try again.</div>
            {% endif %}
        </form>
        <div class="login-back">
            <a href="/">&larr; Back to Blog</a>
        </div>
    </div>
</body>
</html>
