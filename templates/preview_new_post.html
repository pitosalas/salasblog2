<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview: {{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-3 mb-3">
        <a class="navbar-brand" href="/">Salas Blog</a>
        <span class="navbar-text">Preview (unsaved)</span>
        <div class="d-flex gap-2">
            <button class="btn btn-success btn-sm" onclick="createAndClose()">Create &amp; View</button>
            <button class="btn btn-secondary btn-sm" onclick="window.close()">Close</button>
        </div>
    </nav>
    <div class="container">
        <p class="text-muted small">This is how your new post will appear on the blog &mdash; <strong>Filename:</strong> {{ filename }}</p>
        <h1 class="display-6">{{ title }}</h1>
        <div>{{ html_content|safe }}</div>
    </div>
    
    <script>
        // Form data passed from the new post page
        const postData = {
            title: {{ title|tojson }},
            content: {{ content|tojson }},
            date: {{ date|tojson }},
            category: {{ category|tojson }},
            type: {{ type|tojson }}
        };
        
        async function createAndClose() {
            const createBtn = event.target;
            const originalText = createBtn.textContent;
            createBtn.textContent = '✨ Creating...';
            createBtn.disabled = true;
            
            try {
                // Create form data with the current post data
                const formData = new FormData();
                formData.append('title', postData.title);
                formData.append('content', postData.content);
                formData.append('date', postData.date);
                formData.append('category', postData.category);
                formData.append('type', postData.type);
                
                const response = await fetch('/admin/new-post', {
                    method: 'POST',
                    body: formData
                });
                
                const result = await response.json();
                
                if (response.ok) {
                    alert('✓ Post created successfully!');
                    // Navigate to the new post
                    window.location.href = result.url;
                } else {
                    throw new Error(result.detail || 'Creation failed');
                }
            } catch (error) {
                alert('✗ Error creating: ' + error.message);
            } finally {
                createBtn.textContent = originalText;
                createBtn.disabled = false;
            }
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
