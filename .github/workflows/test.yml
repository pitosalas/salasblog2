name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run tests
        run: uv run pytest tests/
          --ignore=tests/integration
          --ignore=tests/deployment
          --ignore=tests/test_file_serving_security.py
          --ignore=tests/test_mime_types.py
          --ignore=tests/test_pages_feature.py
          --ignore=tests/test_raindrops_404_scenarios.py
          --ignore=tests/test_live_server_admin_buttons.py
          --ignore=tests/test_pages_live_server.py
          -q
